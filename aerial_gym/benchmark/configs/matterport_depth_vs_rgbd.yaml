seed: 0

env_counts: [1, 2, 4, 8, 16]
warmup_steps: 100
bench_steps: 300

headless: true
device: cuda:0
controller_name: lee_position_control

camera:
  width: 240
  height: 135
  max_range: 80.0
  enable_lighting: false

render:
  render_every: 4

gif:
  save_gifs: true
  every: 5
  max_frames: 300
  duration_ms: 60

scene:
  # Folder-driven scene input. If set, the first .glb in this folder is used.
  # Works with either absolute path or folder name under scene.root.
  folder: 00800-TEEsavR23oF
  root: resources/envs
  # Optional explicit .glb override. Leave null for folder/default selection.
  file: null

spawn_region:
  # Choose one strategy:
  # 1) from_scene_bounds: true (+ margins/offsets)
  # 2) center + bounds (half-extents)
  # 3) lower + upper
  from_scene_bounds: false
  scene_xy_margin: 0.4
  scene_z_min_offset: 1.0
  scene_z_max_offset: 0.6
  # center: [-9.0, 1.6, 1.6]
  # bounds: [0.3, 0.3, 0.3]
  # lower: [-9.3, 1.3, 1.3]
  # upper: [-8.7, 1.9, 1.9]

navmesh:
  # null => auto-enable when a navmesh is found in the selected scene folder.
  # Set true/false to force behavior.
  enabled: null
  navmesh_file: null
  # Keep sampled spawn points away from navmesh edges.
  edge_padding: 0.3
  oversample_factor: 6
  max_resample_rounds: 10
  strict_edge_padding: true
  min_edge_padding_ratio: 0.35
  padding_relaxation_factor: 0.7
  max_padding_relax_rounds: 3
  # Ensure final spawn points stay inside env bounds after navmesh sampling.
  enforce_env_bounds: true
  max_bound_resample_rounds: 5
  spawn_height_offset_range: [0.3, 0.8]
  zero_velocity_on_spawn: true

robots:
  depth_only: base_quadrotor_with_camera
  rgbd: base_quadrotor_with_rgbd_camera

output:
  report_path: aerial_gym/benchmark/stored_data/matterport_depth_vs_rgbd_benchmark.json
